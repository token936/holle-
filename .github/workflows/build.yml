name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gen_gazescroll.sh && bash gen_gazescroll.sh
      - run: curl -L -o GazeScroll/app/src/main/assets/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
      - run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle assembleDebug --no-daemon
        working-directory: GazeScroll
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: GazeScroll/app/build/outputs/apk/debug/app-debug.apk
